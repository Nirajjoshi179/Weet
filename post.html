<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BIG</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding-bottom:60px;
  background:#f5f5f5;
  font-family:Arial
}

#list{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  padding:15px
}

.box{
  width:calc(50% - 5px);
  padding:10px;
  background:white;
  border-radius:15px;
  box-shadow:0 2px 8px #0002
}

.user{
  display:flex;
  align-items:center;
  gap:8px;
  height:35px
}

.user img{
  width:35px;
  height:35px;
  border-radius:50%;
  object-fit:cover
}

.username{
  font-weight:bold;
  font-size:14px
}

.icon{
  width:100%;
  height:145px;
  margin-top:8px;
  border-radius:8px;
  object-fit:cover
}

.title{
  width:155px;
  border:1px solid black;
  border-radius:5px;
  margin-top:8px;
  overflow:hidden;
  overflow-x:scroll;
  font-weight:bold
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:60px;
  background:royalblue;
  display:flex;
  justify-content:space-around;
  align-items:center;
  font-size:22px
}

.nav a{
  text-decoration:none
}
</style>
</head>

<body>

<div id="list">Loading...</div>


<script>

const db = supabase.createClient(
  "https://wgylobjcxqmjsutgdhdz.supabase.co",
  "sb_publishable_IfpDVaKbbxem461SnCl9UA_LFwdNOon"
);

const list = document.getElementById("list");

async function load(){

  // Current login user
  const { data, error: authError } = await db.auth.getUser();

  if(authError){
    list.innerHTML = authError.message;
    return;
  }

  const user = data.user;

  if(!user){
    list.innerHTML = "Please login first";
    return;
  }

  console.log("Login User ID:", user.id);

  // Only current user's posts
  const { data:posts, error } = await db
    .from("BIG")
    .select("id,title,icon_url,user_id,created_at")
    .eq("user_id", user.id)
    .order("created_at", {ascending:false});

  if(error){
    list.innerHTML = error.message;
    console.log(error);
    return;
  }

  // Current user's profile
  const { data:profiles, error:profileError } = await db
    .from("Profile")
    .select("User_id,username,img")
    .eq("User_id", user.id)
    .limit(1);

  if(profileError){
    console.log(profileError);
  }

  const u = profiles?.[0];

  if(!posts || posts.length === 0){
    list.innerHTML = "Is user ka koi post nahi hai";
    return;
  }

  list.innerHTML = "";

  posts.forEach(x => {

    list.innerHTML += `
      <div class="box">

        <div class="user">

          <img
            src="${u?.img || 'https://via.placeholder.com/35'}"
          >

          <div class="username">
            ${u?.username || "User"}
          </div>

        </div>

        <img
          class="icon"
          src="${x.icon_url}"
        >

        <div class="title">
          ${x.title || ""}
        </div>

      </div>
    `;

  });

}

// IMPORTANT
load();

</script>

</body>
</html>
