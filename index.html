<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>CodeBit</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
}

body{
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  padding:12px;
}

.app{
  width:100%;
  max-width:650px;
  margin:auto;
}

h2{
  text-align:center;
  font-size:22px;
  margin:4px 0 14px;
}

textarea{
  display:block;
  width:100%;
  max-width:100%;
  height:190px;
  padding:12px;
  background:#222;
  color:#fff;
  border:1px solid #333;
  border-radius:10px;
  outline:none;
  font-family:monospace;
  font-size:15px;
  line-height:1.5;
  resize:vertical;
  overflow:auto;
}

textarea:focus{
  border-color:#00b894;
}

.save-btn{
  display:block;
  width:100%;
  height:46px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#00b894;
  color:#fff;
  font-size:17px;
  font-weight:bold;
}

#msg{
  min-height:20px;
  margin-top:9px;
  text-align:center;
  font-size:14px;
  overflow-wrap:anywhere;
}

.pages{
  width:100%;
  margin-top:15px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.card{
  width:100%;
  background:#222;
  padding:10px;
  border-radius:10px;
  border:1px solid #2d2d2d;
  overflow:hidden;
}

.preview-box{
  width:100%;
  overflow:hidden;
  border-radius:8px;
  background:#fff;
}

iframe{
  display:block;
  width:100%;
  height:230px;
  border:0;
  background:#fff;
}

.actions{
  width:100%;
  display:flex;
  margin-top:9px;
}

.actions button{
  width:100%;
  height:42px;
  border:0;
  border-radius:9px;
  background:#00b894;
  color:#fff;
  font-size:15px;
  font-weight:bold;
}

button{
  touch-action:manipulation;
}

@media(max-width:360px){

  body{
    padding:9px;
  }

  h2{
    font-size:20px;
  }

  textarea{
    height:170px;
    font-size:14px;
  }

  iframe{
    height:210px;
  }

  .card{
    padding:8px;
  }
}

@media(min-width:600px){

  body{
    padding:20px;
  }

  textarea{
    height:220px;
  }

  iframe{
    height:280px;
  }
}
</style>
</head>

<body>

<div class="app">

<h2>CodeBit</h2>

<textarea
id="note"
placeholder="Write HTML here..."
spellcheck="false"
autocapitalize="off"
autocomplete="off"></textarea>

<button class="save-btn" onclick="saveNote()">
Save Note
</button>

<p id="msg"></p>

<div class="pages"></div>

</div>

<script type="module">

import { createClient }
from "https://esm.sh/@supabase/supabase-js";

const supabase = createClient(
  "https://wgylobjcxqmjsutgdhdz.supabase.co",
  "sb_publishable_IfpDVaKbbxem461SnCl9UA_LFwdNOon"
);

const note = document.getElementById("note");
const msg = document.getElementById("msg");
const pages = document.querySelector(".pages");

function showMessage(text,color="#00ff66"){
  msg.innerText = text;
  msg.style.color = color;
}

window.saveNote = async function(){

  const code = note.value.trim();

  if(code === ""){
    showMessage("Write something!","#ff5252");
    return;
  }

  showMessage("Saving...","#00b894");

  const {error} = await supabase
    .from("Data")
    .insert([
      {
        Data:code
      }
    ]);

  if(error){
    showMessage(error.message,"#ff5252");
    return;
  }

  showMessage("Note Saved");
  note.value = "";

  loadNotes();
};

async function loadNotes(){

  const {data,error} = await supabase
    .from("Data")
    .select("*")
    .order("id",{ascending:false});

  if(error){
    showMessage(error.message,"#ff5252");
    return;
  }

  pages.innerHTML = "";

  if(!data) return;

  data.forEach(item => {

    const card = document.createElement("div");
    card.className = "card";

    const previewBox = document.createElement("div");
    previewBox.className = "preview-box";

    const frame = document.createElement("iframe");
    frame.className = "preview";

    frame.setAttribute(
      "sandbox",
      "allow-scripts allow-forms"
    );

    frame.srcdoc = item.Data;

    const actions = document.createElement("div");
    actions.className = "actions";

    const copyButton = document.createElement("button");
    copyButton.innerText = "Copy";

    copyButton.addEventListener(
      "click",
      function(){
        copyCode(item.Data);
      }
    );

    previewBox.appendChild(frame);
    actions.appendChild(copyButton);

    card.appendChild(previewBox);
    card.appendChild(actions);

    pages.appendChild(card);

  });
}

window.copyCode = async function(code){

  try{

    await navigator.clipboard.writeText(code);

    showMessage("Copied!");

  }catch(error){

    showMessage("Copy failed","#ff5252");

  }

};

loadNotes();

</script>

</body>
</html>
