<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://wgylobjcxqmjsutgdhdz.supabase.co",
  "sb_publishable_IfpDVaKbbxem461SnCl9UA_LFwdNOon"
);

// Load Cards
async function loadCards() {

  const { data, error } = await supabase
    .from("BIG")
    .select("*")
    .eq(
      "visibility",
      "public"
    )
    .order("id", { ascending: false });

  if (error) {
    console.log(error);
    return;
  }

  const cards = document.querySelector(".cards");
  cards.innerHTML = "";

  data.forEach((imgcard) => {

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
<button class="CardBack" onclick="back(event,this)">
<i class="fa-solid fa-angle-left"></i>
</button>

<div class="headhtml"></div>

<img src="${imgcard.icon_url}">

<div class="iframe">
<iframe class="preview"></iframe>
</div>

<div class="tag">
<h2 class="cardh2">${imgcard.title}</h2>



<p class="p" onclick="copyCode(this)">
Code <i class="fa-solid fa-copy"></i>
</p>
</div>
`;

    card.querySelector(".preview").srcdoc = imgcard.html;
    

    card.addEventListener("click", function () {
      this.classList.add("fullCard");
    });
    

// Copy Button
window.copyCode = function(btn) {

  // इसी card का iframe
  const frame = btn.closest(".card").querySelector(".preview");

  // srcdoc कॉपी करें
  navigator.clipboard.writeText(frame.srcdoc).then(() => {
    msg.innerText = "Copied!";
  }).catch(() => {
    msg.innerText = "Copy Failed!";
  });

};
    cards.appendChild(card);

  });

}

// Upload
window.upload = async function(){

  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");
  const file = document.querySelector(".fileimg").files[0];
  // Click ke turant baad disable
  btn.disabled = true;

  const {
    data:{user}
  } = await supabase.auth.getUser();

  if(!user){
    msg.textContent="पहले Login करें";
    btn.disabled = false;
    return;
  }

  if(!title.value.trim()){
    msg.textContent="Title डालें";
    btn.disabled = false;
    return;
  }
  
const fileName = Date.now() + "_" + file.name;

  const { error: uploadError } = await supabase.storage
    .from("BIG")
    .upload(fileName, file);

  if (uploadError) {
    alert(uploadError.message);
    return;
  }

  const { data: urlData } = supabase.storage
    .from("BIG")
    .getPublicUrl(fileName);
  
  const {error}=await supabase
    .from("BIG")
    .insert({
      title:title.value.trim(),
      html:html.value,
      icon_url:urlData.publicUrl,
      visibility:visibility.value,
      user_id:user.id 
    });

  if(error){
    msg.textContent=error.message;
    btn.disabled = false;
    return;
  }

  msg.textContent = " Upload Successful ✅";

  title.value="";
  html.value="";
  file.value="";
  document.querySelector(".fileimg").value="";
  // Successful upload ke baad disabled hi rahega
  btn.disabled = false;
  loadCards();

};


// Search
const search = document.querySelector("#searchinput");

search.addEventListener("input", function () {

  const value = search.value.toLowerCase();

  document.querySelectorAll(".card").forEach(card => {

    if (card.innerText.toLowerCase().includes(value)) {
      card.classList.remove("hide");
    } else {
      card.classList.add("hide");
    }

  });

});

const input = document.querySelector(".input");

input.addEventListener("input", function () {
  this.value = this.value.replace(/\s/g, "");
});

// Page Load
loadCards();

</script>
<script>
 let html=document.getElementById("html");
 let viewtohtml=document.querySelector(".viewtohtml");
 
function htmlpreview(){
  document.querySelector(".htmls").classList.add("active");
 viewtohtml.srcdoc=html.value;
}
function backs(){
  document.querySelector(".htmls").classList.remove("active");
}
  function nav(id){
  let screens=document.querySelectorAll(".screen");
  screens.forEach((n)=>{
    n.classList.remove("active");
  });
  document.getElementById(id).classList.add("active");
}

function openCard(openCard){
  openCard.classList.add("fullCard");
}

function back(event,back){
  event.stopPropagation();
  back.parentElement.classList.remove("fullCard");
  
}
document.querySelector("#searchinput").addEventListener("focus", function(e){
  document.querySelector("#searchinput").style.width="230px"
  document.querySelector(".searchBack").style.display="block";
  document.querySelector(".search").style.width="280px";
  document.querySelector(".search").style.marginLeft="20px"
  
});
document.querySelector(".searchBack").addEventListener("click",()=>{
  document.querySelector(".searchBack").style.display="none";
  

  
})

document.querySelector(".searchBack").addEventListener("click",function(){
  document.querySelector("#searchinput").style.width="250px"
  document.querySelector(".search").style.width="300px";
  document.querySelector(".search").style.marginLeft="0px"
  document.querySelectorAll(".card").style.display="block"
  
});

function SaveShow(){
  document.querySelector(".SaveShowbox").classList.add("SaveShow");
}
function SaveShowboxBack(){
  document.querySelector(".SaveShowbox").classList.remove("SaveShow")
}

</script>
